<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumina</title>
 <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d3a8a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#1c2333}
header{background:#1d3a8a;color:#fff;padding:18px 16px;text-align:center}
header h1{margin:0;font-size:26px}
header p{margin:4px 0 0;font-size:14px;opacity:.85}
main{padding:16px;max-width:600px;margin:auto}
h2{font-size:20px}
h3{margin-top:24px}
.carte{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d5dbe8;border-radius:12px;padding:16px;margin:10px 0;font-size:17px;color:#1c2333}
.carte.off{opacity:.5}
.carte small{display:block;font-size:13px;margin-top:4px}
.retour{background:none;border:none;color:#1d3a8a;font-size:16px;padding:6px 0;margin-bottom:6px}
.cours{background:#fff;border-left:5px solid #1d3a8a;border-radius:8px;padding:12px 16px;line-height:1.5}
.q{background:#fff;border-radius:12px;padding:14px;margin:12px 0}
.opt{display:block;width:100%;text-align:left;background:#eef1f8;border:1px solid #d5dbe8;border-radius:8px;padding:12px;margin:6px 0;font-size:16px;color:#1c2333}
.opt.bon{background:#c9f0d4;border-color:#2e9e57}
.opt.mauvais{background:#f7c9c9;border-color:#c53b3b}
.exp{font-size:15px;color:#333;margin:8px 0 0}
.score{font-size:18px;font-weight:bold;text-align:center;margin:20px 0}
</style>
</head>
<body>
<header>
<h1>Lumina</h1>
<p>Révisions BEPC · Classe de Troisième</p>
</header>
<main id="app"></main>
<script>
const matieres=[
 {n:'Mathématiques',ok:true},
 {n:'Français'},
 {n:'Anglais'},
 {n:'PCT / SVT'}
];

const chapitres=[
 {
  t:'Théorème de Pythagore',
  cours:`<svg viewBox="0 0 220 150" width="100%" style="max-width:260px;display:block;margin:8px auto"><polygon points="40,120 40,30 160,120" fill="#eef1f8" stroke="#1d3a8a" stroke-width="2"/><polyline points="40,108 52,108 52,120" fill="none" stroke="#1d3a8a" stroke-width="1.5"/><text x="22" y="126" font-size="14">A</text><text x="22" y="28" font-size="14">B</text><text x="166" y="126" font-size="14">C</text><text x="14" y="78" font-size="12">AB</text><text x="90" y="138" font-size="12">AC</text><text x="108" y="62" font-size="12" fill="#c53b3b">BC (hypoténuse)</text></svg><p><b>Théorème :</b> dans un triangle rectangle, le carré de l'hypoténuse est égal à la somme des carrés des deux autres côtés.</p>
  <p>Si ABC est rectangle en A : <b>BC² = AB² + AC²</b></p>
  <p>L'hypoténuse est le côté opposé à l'angle droit (le plus long).</p>
  <p><b>Réciproque :</b> si BC² = AB² + AC², alors ABC est rectangle en A.</p>
  <p><b>Exemple :</b> AB = 3 et AC = 4. BC² = 9 + 16 = 25, donc BC = 5.</p>`,
  quiz:[
   {q:'ABC est rectangle en A, AB = 6 et AC = 8. Combien vaut BC ?',o:['10','14','12'],r:0,e:'BC² = 36 + 64 = 100, donc BC = 10.'},
   {q:'Dans un triangle rectangle, l\'hypoténuse mesure 13 et un côté mesure 5. L\'autre côté mesure :',o:['8','12','18'],r:1,e:'x² = 169 − 25 = 144, donc x = 12.'},
   {q:'Un triangle a pour côtés 5, 12 et 13. Est-il rectangle ?',o:['Oui','Non'],r:0,e:'13² = 169 et 5² + 12² = 25 + 144 = 169. D\'après la réciproque, il est rectangle.'},
   {q:'L\'hypoténuse est :',o:['Le plus petit côté','Le côté opposé à l\'angle droit','Un côté de l\'angle droit'],r:1,e:'C\'est le côté opposé à l\'angle droit, et le plus long.'}
  ]
 },
 {
  t:'Équations et inéquations',
  cours:`<svg viewBox="0 0 230 90" width="100%" style="max-width:260px;display:block;margin:8px auto"><line x1="8" y1="45" x2="222" y2="45" stroke="#1d3a8a" stroke-width="2"/><line x1="30" y1="40" x2="30" y2="50" stroke="#1d3a8a" stroke-width="2"/><line x1="60" y1="40" x2="60" y2="50" stroke="#1d3a8a" stroke-width="2"/><line x1="90" y1="40" x2="90" y2="50" stroke="#1d3a8a" stroke-width="2"/><line x1="120" y1="40" x2="120" y2="50" stroke="#1d3a8a" stroke-width="2"/><line x1="150" y1="40" x2="150" y2="50" stroke="#1d3a8a" stroke-width="2"/><line x1="180" y1="40" x2="180" y2="50" stroke="#1d3a8a" stroke-width="2"/><text x="22" y="65" font-size="12">−3</text><text x="52" y="65" font-size="12">−2</text><text x="82" y="65" font-size="12">−1</text><text x="116" y="65" font-size="12">0</text><text x="146" y="65" font-size="12">1</text><text x="176" y="65" font-size="12">2</text><line x1="14" y1="45" x2="30" y2="45" stroke="#c53b3b" stroke-width="5"/><polygon points="6,45 16,39 16,51" fill="#c53b3b"/><circle cx="30" cy="45" r="5" fill="#fff" stroke="#c53b3b" stroke-width="2"/><text x="8" y="22" font-size="12" fill="#c53b3b">x &lt; −3 : cercle ouvert, solutions à gauche</text></svg><p><b>Équation :</b> pour résoudre ax + b = c, on isole x.</p>
  <p><b>Exemple :</b> 2x + 3 = 11 → 2x = 8 → x = 4.</p>
  <p><b>Inéquation :</b> même méthode, mais <b>on change le sens de l'inégalité quand on multiplie ou divise par un nombre négatif</b>.</p>
  <p><b>Exemple :</b> −2x + 1 &gt; 7 → −2x &gt; 6 → x &lt; −3.</p>`,
  quiz:[
   {q:'Résous : 3x − 5 = 10',o:['x = 5','x = 3','x = 15'],r:0,e:'3x = 15, donc x = 5.'},
   {q:'Résous : 2x + 7 = 1',o:['x = 3','x = −3','x = −4'],r:1,e:'2x = −6, donc x = −3.'},
   {q:'Résous : x + 4 &lt; 9',o:['x &lt; 13','x &lt; 5','x &gt; 5'],r:1,e:'x &lt; 9 − 4, donc x &lt; 5.'},
   {q:'Résous : −3x ≥ 12',o:['x ≥ −4','x ≤ −4','x ≤ 4'],r:1,e:'On divise par −3, donc le sens change : x ≤ −4.'},
   {q:'Résous : 5x − 2 = 3x + 6',o:['x = 4','x = 2','x = 8'],r:0,e:'2x = 8, donc x = 4.'}
  ]
 },
 {
  t:'Théorème de Thalès',
  cours:`<svg viewBox="0 0 230 150" width="100%" style="max-width:260px;display:block;margin:8px auto"><polygon points="110,15 30,130 200,130" fill="#eef1f8" stroke="#1d3a8a" stroke-width="2"/><line x1="78" y1="61" x2="146" y2="61" stroke="#c53b3b" stroke-width="2"/><text x="104" y="12" font-size="14">A</text><text x="58" y="66" font-size="14">M</text><text x="150" y="66" font-size="14">N</text><text x="14" y="140" font-size="14">B</text><text x="204" y="140" font-size="14">C</text><text x="100" y="54" font-size="11" fill="#c53b3b">(MN)</text><text x="100" y="122" font-size="11" fill="#1d3a8a">(BC)</text></svg><p><b>Situation :</b> les droites (MN) et (BC) sont parallèles. Les points A, M, B sont alignés, et A, N, C aussi.</p>
  <p><b>Alors :</b> AM/AB = AN/AC = MN/BC</p>
  <p><b>Astuce :</b> chaque rapport compare le petit triangle (AMN) au grand triangle (ABC).</p>
  <p><b>Exemple :</b> AM = 2, AB = 6, AN = 3. On écrit 3/AC = 2/6, donc AC = 3 × 6 ÷ 2 = 9.</p>
  <p><b>Réciproque :</b> si AM/AB = AN/AC (points dans le même ordre), alors (MN) est parallèle à (BC).</p>
  <p><b>Erreur fréquente :</b> utiliser Thalès sans être sûr que les droites sont parallèles.</p>`,
  quiz:[
   {q:'(MN) // (BC), AM = 2, AB = 6, AN = 3. Combien vaut AC ?',o:['9','1','4'],r:0,e:'AN/AC = AM/AB, donc 3/AC = 2/6 et AC = 9.'},
   {q:'(MN) // (BC), AM = 4, AB = 10, BC = 15. Combien vaut MN ?',o:['6','37,5','9'],r:0,e:'MN/BC = AM/AB, donc MN = 15 × 4 ÷ 10 = 6.'},
   {q:'Que faut-il avoir avant d\'utiliser Thalès ?',o:['Un triangle rectangle','Deux droites parallèles','Deux côtés égaux'],r:1,e:'Thalès s\'utilise quand deux droites sont parallèles.'},
   {q:'AM = 3, AB = 6, AN = 4, AC = 8. (MN) et (BC) sont-elles parallèles ?',o:['Oui','Non'],r:0,e:'3/6 = 1/2 et 4/8 = 1/2. Les rapports sont égaux, donc d\'après la réciproque, elles sont parallèles.'}
  ]
 },
 {
  t:'Trigonométrie',
  cours:`<svg viewBox="0 0 230 150" width="100%" style="max-width:260px;display:block;margin:8px auto"><polygon points="40,120 190,120 40,30" fill="#eef1f8" stroke="#1d3a8a" stroke-width="2"/><polyline points="40,108 52,108 52,120" fill="none" stroke="#1d3a8a" stroke-width="1.5"/><path d="M160,120 A30,30 0 0 1 164.3,104.6" fill="none" stroke="#c53b3b" stroke-width="2"/><text x="22" y="132" font-size="14">A</text><text x="196" y="126" font-size="14">B</text><text x="22" y="28" font-size="14">C</text><text x="0" y="78" font-size="11" fill="#c53b3b">opposé</text><text x="88" y="138" font-size="11" fill="#1d3a8a">adjacent</text><text x="112" y="64" font-size="11" fill="#1d3a8a">hypoténuse</text><text x="138" y="112" font-size="11" fill="#c53b3b">B</text></svg><p><b>Situation :</b> triangle ABC rectangle en A, et on regarde l'angle B.</p>
  <p><b>Les trois côtés :</b> l'hypoténuse est BC. Le côté opposé à B est AC. Le côté adjacent à B est AB.</p>
  <p><b>SOH CAH TOA :</b></p>
  <p><b>sin B = opposé / hypoténuse = AC/BC</b></p>
  <p><b>cos B = adjacent / hypoténuse = AB/BC</b></p>
  <p><b>tan B = opposé / adjacent = AC/AB</b></p>
  <p><b>Exemple :</b> BC = 10 et B = 30°. AC = BC × sin 30° = 10 × 0,5 = 5.</p>
  <p><b>Erreur fréquente :</b> mélanger « opposé » et « adjacent ». Ils changent quand on change d'angle.</p>`,
  quiz:[
   {q:'ABC rectangle en A. sin B est égal à :',o:['AC/BC','AB/BC','AC/AB'],r:0,e:'sin = opposé / hypoténuse. Pour l\'angle B, l\'opposé est AC et l\'hypoténuse est BC.'},
   {q:'ABC rectangle en A. cos B est égal à :',o:['AC/BC','AB/BC','AB/AC'],r:1,e:'cos = adjacent / hypoténuse, soit AB/BC.'},
   {q:'ABC rectangle en A, AB = 4 et AC = 4. Combien vaut tan B ?',o:['0','1','4'],r:1,e:'tan B = AC/AB = 4/4 = 1.'},
   {q:'ABC rectangle en A, BC = 10 et B = 30°. Combien mesure AC ? (sin 30° = 0,5)',o:['5','20','10'],r:0,e:'AC = BC × sin 30° = 10 × 0,5 = 5.'},
   {q:'Que signifie le « T » dans SOH CAH TOA ?',o:['Triangle','Tangente','Théorème'],r:1,e:'T veut dire tangente : TOA = Tangente = Opposé / Adjacent.'}
  ]
 }
];

const app=document.getElementById('app');
let score=0,rep=0;

function accueil(){
 app.innerHTML='<h2>Choisis une matière</h2>'+matieres.map(m=>m.ok
  ?`<button class="carte" onclick="maths()">${m.n}</button>`
  :`<div class="carte off">${m.n}<small>Bientôt disponible</small></div>`).join('');
}

function maths(){
 app.innerHTML='<button class="retour" onclick="accueil()">← Retour</button><h2>Mathématiques · Troisième</h2>'
 +chapitres.map((c,i)=>`<button class="carte" onclick="chapitre(${i})">${c.t}</button>`).join('');
}

function chapitre(i){
 const c=chapitres[i];
 score=0;rep=0;
 app.innerHTML=`<button class="retour" onclick="maths()">← Retour</button><h2>${c.t}</h2><div class="cours">${c.cours}</div><h3>Exercices</h3>`
 +c.quiz.map((q,j)=>`<div class="q"><p><b>${j+1}.</b> ${q.q}</p>`
 +q.o.map((o,k)=>`<button class="opt" onclick="choisir(${i},${j},${k},this)">${o}</button>`).join('')
 +`<p class="exp" id="e${j}"></p></div>`).join('')
 +'<p class="score" id="score"></p>';
}

function choisir(i,j,k,b){
 const q=chapitres[i].quiz[j];
 const bloc=b.parentNode;
 if(bloc.dataset.fait)return;
 bloc.dataset.fait=1;
 bloc.querySelectorAll('.opt').forEach((x,n)=>{x.disabled=true;if(n===q.r)x.classList.add('bon');});
 if(k!==q.r){b.classList.add('mauvais');}else{score++;}
 rep++;
 document.getElementById('e'+j).innerHTML=q.e;
 if(rep===chapitres[i].quiz.length){
  document.getElementById('score').textContent='Ton score : '+score+' / '+rep;
 }
}

accueil();
</script>
</body>
</html>

<script>
if (!document.querySelector('link[rel="manifest"]')) {
  var l = document.createElement('link');
  l.rel = 'manifest';
  l.href = 'manifest.json';
  document.head.appendChild(l);
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
